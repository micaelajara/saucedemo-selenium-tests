name: Selenium Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ubuntu-latest ships Chrome preinstalled; Selenium 4's built-in
      # Selenium Manager resolves and downloads the matching driver on its
      # own, no manual chromedriver setup needed.
      - run: pip install -r requirements.txt

      - run: pytest -v
